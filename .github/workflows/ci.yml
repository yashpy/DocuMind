name: ci

on: [push, pull_request]

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Unit tests
        run: pytest -q
      - name: Evaluation (agent vs single-shot baseline, offline provider)
        run: python -m documind.evaluation --kb data/kb.jsonl --eval data/eval.jsonl
